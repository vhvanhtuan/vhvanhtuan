<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="760" height="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" role="img" aria-label="Declare once, one shared engine builds every screen">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="376" rx="12" fill="#ffffff"/>

  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">Declare once, one shared engine builds every screen</text>
  <text x="24" y="68" font-size="11.5" font-weight="600" fill="#59636e">YOU DECLARE</text>
  <text x="290" y="68" font-size="11.5" font-weight="600" fill="#59636e">THE SYSTEM DOES</text>
  <text x="516" y="68" font-size="11.5" font-weight="600" fill="#59636e">STAFF GET</text>

  <g fill="none" stroke="#9aa0a6" stroke-width="1.25">
    <path d="M244 112H290" marker-end="url(#arrow)"/>
    <path d="M244 184H290" marker-end="url(#arrow)"/>
    <path d="M244 256H290" marker-end="url(#arrow)"/>
    <path d="M470 112H516" marker-end="url(#arrow)"/>
    <path d="M470 184H516" marker-end="url(#arrow)"/>
    <path d="M470 256H516" marker-end="url(#arrow)"/>
    <path d="M380 284V308" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <!-- You declare -->
  <rect x="24" y="84" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="36" y="108" font-weight="600" fill="#1f2328">Tables</text>
  <text x="36" y="126" font-size="11.5" fill="#59636e">Name, menu group, child tables</text>

  <rect x="24" y="156" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="36" y="180" font-weight="600" fill="#1f2328">Fields</text>
  <text x="36" y="198" font-size="11.5" fill="#59636e">Input type, dropdown source</text>

  <rect x="24" y="228" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="36" y="252" font-weight="600" fill="#1f2328">Role permissions</text>
  <text x="36" y="270" font-size="11.5" fill="#59636e">Read / create / update / delete</text>

  <!-- Engine -->
  <rect x="290" y="84" width="180" height="200" rx="8" fill="#e8f0fc" stroke="#2f6fd6" stroke-width="2"/>
  <text x="302" y="112" font-weight="600" fill="#1f2328">Shared CMS engine</text>
  <text x="302" y="144" font-size="11.5" fill="#1f2328">Checks login and role</text>
  <text x="302" y="168" font-size="11.5" fill="#1f2328">Filters by company</text>
  <text x="302" y="192" font-size="11.5" fill="#1f2328">Safe, prepared queries</text>
  <text x="302" y="216" font-size="11.5" fill="#1f2328">Logs creator and editor</text>
  <text x="302" y="240" font-size="11.5" fill="#1f2328">One API for every table</text>

  <rect x="290" y="308" width="180" height="44" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="380" y="334" text-anchor="middle" fill="#1f2328">Database</text>

  <!-- Staff get -->
  <rect x="516" y="84" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="528" y="108" font-weight="600" fill="#1f2328">Automatic menu</text>
  <text x="528" y="126" font-size="11.5" fill="#59636e">Shown only to permitted roles</text>

  <rect x="516" y="156" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="528" y="180" font-weight="600" fill="#1f2328">Lists</text>
  <text x="528" y="198" font-size="11.5" fill="#59636e">Search, filters, paging</text>

  <rect x="516" y="228" width="220" height="56" rx="8" fill="none" stroke="#c4c8cc" stroke-width="1.25"/>
  <text x="528" y="252" font-weight="600" fill="#1f2328">Forms</text>
  <text x="528" y="270" font-size="11.5" fill="#59636e">Dependent dropdowns, uploads</text>
</svg>
